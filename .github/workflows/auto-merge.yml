name: Auto-merge PR

on:
  workflow_run:
    workflows: ["Run Pytest"] 
    types:
      - completed

jobs:
  merge:
    runs-on: ubuntu-latest
    # 2. Only run if the triggering workflow actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    permissions:
      pull-requests: write
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Automatically Merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "Finding pull request for branch: '$PR_BRANCH'"

          # first try direct lookup (works for same-repo heads)
          PR_NUMBER=$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number' || true)

          # If direct lookup failed, try matching headRefName from open PRs (works for forks)
          if [ -z "$PR_NUMBER" ]; then
            echo "Direct lookup failed; trying to match headRefName among open PRs"
            PR_NUMBER=$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName=="'"$PR_BRANCH"'") | .number' | head -n1 || true)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request found for branch '$PR_BRANCH'. Listing open PRs for debugging:"
            gh pr list --state open --limit 50 --json number,title,headRefName,headRepositoryOwner || true
            exit 0
          fi

          echo "Merging PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash --repo "${GITHUB_REPOSITORY}"          
          echo "Merging PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash 

