name: Auto-merge PR

on:
  workflow_run:
    workflows: ["Run Pytest"] 
    types:
      - completed

jobs:
  merge:
    runs-on: ubuntu-latest
    # 2. Only run if the triggering workflow actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Automatically Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "Finding pull request for branch: $PR_BRANCH"
          
          # 1. Inicializamos un git ficticio para que 'gh' no falle buscando la carpeta .git
          git init -b main > /dev/null
          
          # 2. Buscamos el número de PR usando la API directamente (método ultra robusto)
          PR_NUMBER=$(gh api repos/$GH_REPO/pulls \
            -F head="${GH_REPO}:${PR_BRANCH}" \
            -F state=open \
            --jq '.[0].number')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open pull request found for branch $PR_BRANCH."
            exit 0
          fi
          
          echo "Merging PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --squash --auto
