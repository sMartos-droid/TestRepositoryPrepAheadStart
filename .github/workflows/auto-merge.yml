name: 03 - Auto-merge PR

on:
  workflow_run:
    workflows: ["02 - Auto Open Pull Request"] 
    types:
      - completed

jobs:
  merge:
    runs-on: ubuntu-latest
    # 2. Only run if the triggering workflow actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    permissions:
      pull-requests: write
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Automatically Merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
      # (replace the run: | block under "Automatically Merge PR" step with the following)
        run: |
          set -euo pipefail
          echo "Finding pull request for branch: $PR_BRANCH"
        
          PR_NUMBER=$(gh pr list --head "$PR_BRANCH" --json number --jq '.[0].number' || true)
        
          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request found for branch $PR_BRANCH."
            exit 0
          fi
        
          echo "Found PR #$PR_NUMBER. Inspecting repository info..."
          # Get the full name of the head repository for the PR (e.g. owner/repo)
          HEAD_REPO=$(gh pr view "$PR_NUMBER" --json headRepository --jq '.headRepository.fullName' || true)
          echo "PR head repository: $HEAD_REPO"
          echo "Current repository: $GITHUB_REPOSITORY"
        
          # Try to merge; if it fails due to not-mergeable, handle accordingly
          try_merge() {
            echo "Attempting to merge PR #$PR_NUMBER..."
            if gh pr merge "$PR_NUMBER" --squash --admin --confirm; then
              echo "PR #$PR_NUMBER merged successfully."
              return 0
            else
              return 1
            fi
          }
        
          if try_merge; then
            exit 0
          fi
        
          echo "Initial merge attempt failed. Checking whether the PR is mergeable..."
          # If the PR head repo is the same as this repo, we can attempt to update the branch
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "PR branch is in this repository. Attempting to update branch with latest main..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
            # Checkout the PR branch and merge main into it
            git fetch origin main:refs/remotes/origin/main
            git fetch origin "refs/heads/$PR_BRANCH":refs/remotes/origin/"$PR_BRANCH" || true
            git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"
        
            # Try to merge origin/main. If merge conflicts occur, exit to comment.
            if git merge --no-edit origin/main; then
              echo "Merged origin/main into $PR_BRANCH successfully, pushing updated branch..."
              git push origin "$PR_BRANCH"
              echo "Retrying merge..."
              if try_merge; then
                exit 0
              else
                echo "Merge still failed after updating branch."
                gh pr comment "$PR_NUMBER" --body "I tried merging main into this branch automatically but the merge still failed. Please resolve conflicts locally and push an update, or merge main into the branch and push. See: git fetch origin main && git merge origin/main"
                exit 0
              fi
            else
              echo "Automatic merge of main into $PR_BRANCH produced conflicts."
              gh pr comment "$PR_NUMBER" --body "Automatic merge of the target branch produced conflicts. Please fetch main and resolve the conflicts locally (git fetch origin main && git merge origin/main), then push the updated branch so this PR can be merged."
              # Reset any partially-applied merge to keep the workspace clean
              git merge --abort || true
              exit 0
            fi
          else
            echo "PR comes from a fork (or different repo). Cannot push to update the branch."
            gh pr comment "$PR_NUMBER" --body "This PR cannot be merged automatically because it has conflicts with the target branch. Please update your branch by merging or rebasing main into it and push the changes so the PR becomes mergeable."
            exit 0
          fi
