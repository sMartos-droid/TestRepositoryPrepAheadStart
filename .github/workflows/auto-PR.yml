name: 02 - Auto Open Pull Request

on:
  workflow_run:
    workflows: ["Run Pytest"] 
    types:
      - completed

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated PR updates"
          title: "PR: ${{ github.ref_name }}"
          body: "This PR was automatically created upon pushing code to the branch `${{ github.ref_name }}`."
          branch-suffix: short-commit-hash # Prevents conflicts if pushed multiple times
